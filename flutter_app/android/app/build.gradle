plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace "com.blockwebmaster.app"
    // 36 required by app_links/shared_preferences_android/url_launcher_android's
    // transitive androidx deps (androidx.browser 1.9.0, androidx.core(-ktx) 1.17.0) —
    // 35 caused a hard CheckAarMetadataWorkAction failure in CI.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Matches app.json's android.package in the RN app — same app
        // identity carries over so this can eventually replace it as an
        // update rather than a new Play Store listing.
        applicationId "com.blockwebmaster.app"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // No release keystore exists yet — debug-signed so
            // `flutter build apk --release` (and this repo's CI) keeps
            // working until real signing secrets are configured. Replace
            // with a real signingConfig (keystore path + secrets-backed
            // passwords) before shipping to the Play Store.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {}
