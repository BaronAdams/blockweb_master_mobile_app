pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Bumped again after the second real CI run (2026-08): 8.6.0 satisfied
    // the first run's minimum but a hard CheckAarMetadataWorkAction failure
    // showed transitive deps of app_links/shared_preferences_android/
    // url_launcher_android (androidx.browser 1.9.0, androidx.core-ktx/core
    // 1.17.0) require AGP >= 8.9.1 + compileSdk >= 36. Flutter's own
    // "will soon be dropped" warning on the same run named 8.11.1 as the
    // next hard floor, so jumping straight there instead of the bare
    // 8.9.1 minimum to avoid a third round over the same issue. Gradle
    // bumped to 8.14.0 to match (see
    // android/gradle/wrapper/gradle-wrapper.properties), which is also
    // what Flutter's warning named as its own minimum, and is comfortably
    // within AGP 8.11.1's supported Gradle range.
    id "com.android.application" version "8.11.1" apply false
    // Declared 1.9.24 previously but the CI log showed Kotlin 2.0.0 was
    // actually applied (flutter-gradle-plugin overrides it) — declaring
    // the version Flutter's warning asked for (>=2.2.20) explicitly so it
    // actually takes effect instead of being silently overridden again.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
