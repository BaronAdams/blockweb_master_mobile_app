pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Bumped from 8.5.0 after the first real CI run (2026-08): Flutter's
    // stable channel had moved to 3.44.9 by then, which requires AGP
    // >= 8.6.0 — the CI log spelled out the exact minimum, so this matches
    // it precisely rather than guessing further ahead and risking a new
    // Gradle-too-old mismatch instead. Gradle stays at 8.7 (see
    // android/gradle/wrapper/gradle-wrapper.properties) — the official
    // AGP/Gradle compatibility table lists 8.7 as AGP 8.6's minimum, so
    // this pairing is still self-consistent.
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
